name: Site changed / parser broke
description: YouTube changed something and the parser no longer matches.
labels: ["site-change"]
body:
  - type: markdown
    attributes:
      value: |
        This is the most common way a scraper stops working, and it is worth its
        own report because the fix is different from a code bug: something in
        YouTube's payload moved.

        Useful to know before filing: the parser reads the JSON from
        `/youtubei/v1/next` (and `/youtubei/v1/player` for `--mode video`),
        never the DOM. Comments come in two shapes — the entity shape first,
        the legacy `commentRenderer` shape as a fallback — and each row's
        `data_source` says which one it was read from.

  - type: dropdown
    id: what_broke
    attributes:
      label: What stopped matching
      options:
        - Comments (0 rows on a video that visibly has comments)
        - A specific field is null or wrong (text, author, like count, date)
        - Replies are missing (--replies)
        - Pagination stops early or repeats a page
        - --mode video or --mode search returns wrong or empty rows
        - The captcha detector finds nothing on a page that has one
        - Something else
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: URL
      description: The exact video URL or search query, the mode and sort, and the country your exit IP was in.
      placeholder: "https://www.youtube.com/watch?v=dQw4w9WgXcQ (--mode comments --sort top, exit IP: FI datacentre)"
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence from the page
      description: |
        Whichever of these you can get. A capture beats a description.

        - The payload as the site served it: re-run with `--dump-html` and
          attach the relevant part of the dump.
        - For a comment problem: the comment id (`sku`) and its `data_source`.
        - For a field problem: the value you got, and the value on the page.
      render: text
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: >-
        Whether it reproduces on a second engine, whether it reproduces from a
        different country, and when it last worked.
